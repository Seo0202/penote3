<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글 목록</title>
</head>
<body>
    <h1>글 목록</h1>
    <form th:action="@{/articles/new}" method="get">
        <button type="submit">새 글 작성</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="article : ${articleList}">
                <td th:text="${article.id}">1</td>
                <td><a th:href="@{/articles/{id}(id=${article.id})}" th:text="${article.title}">제목</a></td>
                <td th:text="${article.author}">작성자</td>
                <td th:text="${article.createdAt != null} ? ${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')} : ''">2026-01-01 00:00</td>
            </tr>
            <tr th:if="${#lists.isEmpty(articleList)}">
                <td colspan="4">작성된 글이 없습니다.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
