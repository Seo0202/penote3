<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글 목록</title>
</head>
<body>
    <h1>글 목록</h1>
    <a th:href="@{/articles/new}">새 글 작성</a>
    <table>
        <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="article : ${articleList}">
                <td th:text="${article.id}">1</td>
                <td><a th:href="@{/articles/{id}(id=${article.id})}" th:text="${article.title}">제목</a></td>
                <td th:text="${article.author}">작성자</td>
            </tr>
            <tr th:if="${#lists.isEmpty(articleList)}">
                <td colspan="3">작성된 글이 없습니다.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
