<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title}">제목</title>
</head>
<body>
    <h1 th:text="${article.title}">제목</h1>
    <p>작성자: <span th:text="${article.author}">작성자</span></p>

</html>
