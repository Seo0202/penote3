<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title}">제목</title>
</head>
<body>
    <h1 th:text="${article.title}">제목</h1>
    <p>작성자: <span th:text="${article.author}">작성자</span></p>
    <p th:if="${article.createdAt != null}">작성일: <span th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</span></p>
    <p style="white-space: pre-wrap" th:text="${article.content}">내용</p>
    <a th:href="@{/articles}">목록으로</a>
    <a th:href="@{/articles/{id}/edit(id=${article.id})}">수정</a>
    <form th:action="@{/articles/{id}(id=${article.id})}" method="post">
        <input type="hidden" name="_method" value="delete">
        <button type="submit">삭제</button>
    </form>
    <table>
    <tbody>
    <tr th:each="comment : ${commentList}">
        <td th:text="${comment.id}">1</td>
        <td th:text="${comment.content}">내용</td>
        <td th:text="${comment.author}">작성자</td>
        <td th:text="${comment.createdAt != null} ? ${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')} : ''">2026-01-01 00:00</td>
        <td>
            <a th:href="@{/articles/{articleId}/comments/{id}/edit(articleId=${article.id}, id=${comment.id})}">수정</a>
            <form th:action="@{/articles/{articleId}/comments/{id}(articleId=${article.id}, id=${comment.id})}"
                  method="post" style="display: inline">
                <input type="hidden" name="_method" value="delete">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(commentList)}">
        <td colspan="5">작성된 댓글이 없습니다.</td>
    </tr>
    </tbody>
    </table>
    <h3>댓글 작성</h3>
    <p th:if="${commentError}" th:text="${commentError}" style="color: red"></p>
    <form th:action="@{/articles/{id}/comments(id=${article.id})}" th:object="${comment}" method="post">
        <p>
            <label for="author">작성자</label><br>
            <input type="text" id="author" th:field="*{author}">
        </p>
        <p>
            <label for="content">내용</label><br>
            <textarea id="content" rows="3" cols="50" th:field="*{content}"></textarea>
        </p>
        <button type="submit">등록</button>
    </form>
</body>
</html>
