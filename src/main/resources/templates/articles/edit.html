<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글 수정</title>
</head>
<body>
    <h1>글 수정</h1>
    <form th:action="@{/articles/{id}(id=${article.id})}" th:object="${article}" method="post">
        <input type="hidden" name="_method" value="patch">
        <p>
            <label for="title">제목</label><br>
            <input type="text" id="title" th:field="*{title}">
        </p>
        <p>작성자: <span th:text="*{author}">작성자</span></p>
        <p>
            <label for="content">내용</label><br>
            <textarea id="content" rows="10" cols="50" th:field="*{content}"></textarea>
        </p>
        <button type="submit">수정</button>
    </form>
</body>
</html>
